name: Deep History Studio

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  repository_dispatch:
    types: [opshub.produce, opshub.run]

permissions:
  contents: write

concurrency:
  group: deep-history-production
  cancel-in-progress: false

jobs:
  produce:
    # Production stays OFF until the owner explicitly sets the repository
    # Actions variable PRODUCTION_ENABLED=true after compliance/API setup.
    if: vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore episode work
        uses: actions/cache@v4
        with:
          path: |
            episodes/*/images
            episodes/*/audio
            episodes/*/script.json
            episodes/*/shotlist.json
          key: dhs-work-${{ github.run_id }}
          restore-keys: dhs-work-
      - name: Enforce committed memory state
        run: git checkout -- memory/ 2>/dev/null || true
      - name: Install deps
        run: |
          set -o pipefail
          pip install -r requirements.txt 2>&1 | tee install.log && true
          test ${PIPESTATUS[0]} -eq 0
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Write
        id: write
        run: |
          set -o pipefail
          python pipeline.py write 2>&1 | tee write.log
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUB_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
      - name: Produce
        id: produce
        run: |
          set -o pipefail
          python pipeline.py produce 2>&1 | tee produce.log
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Notify
        id: notify
        if: success()
        run: |
          set -o pipefail
          python pipeline.py notify 2>&1 | tee notify.log
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HUB_URL: ${{ secrets.HUB_URL }}
          OPSHUB_URL: ${{ secrets.OPSHUB_URL }}
          HUB_WEBHOOK_SECRET: ${{ secrets.HUB_WEBHOOK_SECRET }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          path: |
            install.log
            write.log
            produce.log
            notify.log
          if-no-files-found: ignore
          retention-days: 30
