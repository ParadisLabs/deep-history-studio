name: Render quality tests

on:
  pull_request:
    paths:
      - "longform.py"
      - "renderer.py"
      - "pipeline.py"
      - ".github/workflows/produce.yml"
      - "render_quality.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/render-quality-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "renderer.py"
      - "render_quality.py"
      - "tests/**"
      - ".github/workflows/render-quality-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install studio dependencies
        run: pip install -r requirements.txt
      - name: Compile production pipeline and renderer
        run: python -m py_compile pipeline.py renderer.py render_quality.py longform.py
      - name: Run studio tests
        run: python -m unittest discover -s tests -v
